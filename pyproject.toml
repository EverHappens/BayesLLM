[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-llm"
version = "0.1.0"
description = "GPU-ready synthetic Bayesian ICL experiments for exchangeable and ordered regression tasks."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
hf = [
  "transformers>=4.37",
]
plots = [
  "matplotlib>=3.8",
]

[project.scripts]
bayes-llm-train = "bayes_llm.train:main"
bayes-llm-plot = "bayes_llm.plot_curves:main"
bayes-llm-preview = "bayes_llm.prompting:main"
bayes-llm-function-fit = "bayes_llm.function_fit:main"

[tool.setuptools.packages.find]
where = ["src"]
