[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-llm"
version = "0.1.0"
description = "GPU-ready synthetic Bayesian ICL experiments for exchangeable and ordered regression tasks."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
]

[project.scripts]
bayes-llm-train = "bayes_llm.train:main"

[tool.setuptools.packages.find]
where = ["src"]

